<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>İlker Diş Kliniği - Ödeme Bilgileri</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f8fd;
    color: #10244a;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
    padding: 35px 18px 45px;
}

.header {
    text-align: center;
    margin-bottom: 35px;
}

.tooth {
    font-size: 58px;
    margin-bottom: 8px;
}

.header h1 {
    margin: 0;
    font-size: 34px;
    font-weight: 800;
}

.header p {
    margin: 12px 0 0;
    font-size: 24px;
    color: #667085;
    font-weight: 600;
}

.card {
    background: white;
    border-radius: 22px;
    padding: 25px 22px;
    margin-bottom: 22px;
    box-shadow: 0 8px 25px rgba(16, 36, 74, 0.10);
}

.name-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 15px;
}

.name {
    font-size: 23px;
    font-weight: 800;
}

.name-button {
    width: auto;
    min-width: 120px;
    padding: 10px 12px;
    margin: 0;
    background: #5278b8;
    font-size: 13px;
    white-space: nowrap;
}

.label {
    font-size: 17px;
    color: #667085;
    font-weight: 700;
    margin-bottom: 10px;
}

.iban {
    background: #f4f8fd;
    border: 2px solid #b9d5ff;
    border-radius: 14px;
    padding: 17px 10px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.4px;
    margin-bottom: 12px;
    word-break: break-word;
}

button {
    width: 100%;
    border: none;
    border-radius: 13px;
    padding: 16px;
    background: #075bd8;
    color: white;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 8px;
}

button:active {
    transform: scale(0.98);
}

button.copied {
    background: #198754;
}

.name-button.copied {
    background: #198754;
}

.info {
    background: #eef6ff;
    border: 1px solid #d4e6ff;
    border-radius: 18px;
    padding: 20px;
    text-align: center;
    color: #344054;
    font-size: 16px;
    line-height: 1.5;
    margin-top: 8px;
}

.footer {
    text-align: center;
    margin-top: 28px;
    color: #667085;
    font-size: 14px;
}

.footer-tooth {
    font-size: 32px;
    margin-top: 15px;
}

@media (max-width: 420px) {

    .name {
        font-size: 19px;
    }

    .name-button {
        min-width: 105px;
        font-size: 11px;
        padding: 9px 8px;
    }

    .iban {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="tooth">🦷</div>

        <h1>İlker Diş Kliniği</h1>

        <p>Ödeme Bilgileri</p>
    </div>


    <!-- ELİFNAZ ODUNCU ŞEN -->

    <div class="card">

        <div class="name-row">

            <div class="name">
                Elifnaz Oduncu Şen
            </div>

            <button
                class="name-button"
                onclick="copyText('Elifnaz Oduncu Şen', this)">
                İSMİ KOPYALA
            </button>

        </div>

        <div class="label">
            IBAN
        </div>

        <div class="iban">
            TR66 0001 5001 5800 7375 1492 17
        </div>

        <button
            onclick="copyText('TR66 0001 5001 5800 7375 1492 17', this)">
            IBAN'I KOPYALA
        </button>

    </div>


    <!-- FURKAN YASİN ŞEN -->

    <div class="card">

        <div class="name-row">

            <div class="name">
                Furkan Yasin Şen
            </div>

            <button
                class="name-button"
                onclick="copyText('Furkan Yasin Şen', this)">
                İSMİ KOPYALA
            </button>

        </div>

        <div class="label">
            IBAN
        </div>

        <div class="iban">
            TR39 0001 5001 5800 7368 4277 00
        </div>

        <button
            onclick="copyText('TR39 0001 5001 5800 7368 4277 00', this)">
            IBAN'I KOPYALA
        </button>

    </div>


    <div class="info">
        ℹ️ İsim ve IBAN bilgilerini ayrı ayrı
        kopyalayarak bankacılık uygulamanızda kullanabilirsiniz.
    </div>


    <div class="footer">
        Güvenli ve hızlı ödeme

        <div class="footer-tooth">
            🦷
        </div>
    </div>

</div>


<script>

function copyText(text, button) {

    navigator.clipboard.writeText(text)
    .then(function() {

        const oldText = button.innerText;

        button.innerText = "✓ KOPYALANDI";
        button.classList.add("copied");

        setTimeout(function() {

            button.innerText = oldText;
            button.classList.remove("copied");

        }, 2000);

    })
    .catch(function() {

        alert("Kopyalanacak bilgi: " + text);

    });

}

</script>

</body>
</html>
